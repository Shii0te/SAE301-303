<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MASTER+</title>
  <link rel="stylesheet" href="/styles/main.css" />
  <!-- JS PRINCIPAL -->
  <script type="module">
    import { main } from "/module/Orchestrator.js";
    main();
  </script>
</head>

<body>
  <header>
    <nav>
      <a href="/"><img src="./images/logo-alt.png" alt="logo master plus" width="150" /></a>
      <ul>
        <li>
          <a href="/">Accueil</a>
        </li>
        <li>
          <a id="active-page" href="/tools">Master</a>
        </li>
      </ul>
    </nav>
  </header>
  <main id="app">

    <!-- ================= FICHE MASTER ================= -->
    <section class="fiche-master">
      <div class="fiche-content">

        <!-- Colonne gauche : infos -->
        <div class="infos-master">
          <h1 id="nom-master">Nom du Master</h1>

          <p><strong>mention :</strong> <span id="mention">—</span></p>
          <div class="etab">
            <img src="/images/etab.png" alt="logo établissement">
            <p><strong>Informations clés :</strong> <span id="infos">—</span></p>
          </div>


        </div>

        <!-- Colonne droite : logo -->
        <div class="badge-master">
          <button id="btn-monmaster" class="btn-postuler">Postuler sur MonMaster</button>
        </div>

      </div>
    </section>


    <!-- ================== ZONES DYNAMIQUES ================== -->
    <!-- <section class="infos-master" id="status" aria-live="polite"></section>  -->
    <section id="viz">

    </section>

    <section id="similaires-container">
      <h2>Masters similaires</h2>
      <ul id="similaires"></ul>
    </section>


  </main>


  <!-- OUTILS DE DEBUG (invisibles ) -->
  <div class="debug-tools" style="display:flex; gap:8px; margin:8px 0;">
    <input id="inpId" placeholder="formation_id (ex: ABC123)" hidden />
    <button id="btnLoad" hidden>Charger (comparatif)</button>
  </div>



</body>

</html>
