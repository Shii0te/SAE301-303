<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MASTER+ Page Details Master</title>
  <link rel="stylesheet" href="/styles/main.css" />

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <!-- JS PRINCIPAL -->
  <script type="module">
    import { main } from "/module/Orchestrator.js";
    main();
  </script>
</head>

<body>
  <header>
    <nav>
      <a href="/"><img src="./images/logo-alt.png" alt="logo master plus" width="150" /></a>
      <ul>
        <li>
          <a href="/">Accueil</a>
        </li>
        <li>
          <a id="active-page" href="/tools">Master</a>
        </li>
      </ul>
    </nav>
  </header>
  <main id="app">

    <!-- ================= FICHE MASTER ================= -->
    <section class="fiche-master">
      <div class="fiche-content">

        <!-- Colonne gauche : infos -->
        <div class="infos-master">
          <h1 id="nom-master">Nom du Master</h1>

          <p><strong>mention :</strong> <span id="mention">—</span></p>
          <div class="etab">
            <img src="/images/etab.png" alt="logo établissement">
            <p><strong>Informations clés :</strong> <span id="infos">—</span></p>
          </div>


        </div>

        <!-- Colonne droite : logo -->
        <div class="badge-master">
          <button id="btn-monmaster" class="btn-postuler">Postuler sur MonMaster</button>
        </div>

      </div>
    </section>
    <h2 class="stats-title">Statistiques :</h2>
    <div class="stats-nav">
      <button id="stats-prev" aria-label="Vue précédente">‹</button>
      <button id="stats-next" aria-label="Vue suivante">›</button>
    </div>

    <!-- ================= STATISTIQUES ================= -->
    <section id="viz" class="stats view active">


      <div class="stats-card">

        <!-- Header -->
        <div class="stats-header">
          <h3>Taux d’admissions</h3>

          <div class="stats-switch">
            <button data-year="2024" class="active">2024</button>
            <button data-year="2023">2023</button>
          </div>
        </div>




        <div class="kpis" id="kpis"></div>

        <div id="comparatif"></div>

        <!-- <div class="gauge">
          <svg id="gauge-svg" viewBox="0 0 200 120"></svg>
          <strong id="gauge-value">—</strong>
          <span id="gauge-label">Taux d’admissions</span>
        </div> -->

      </div>
      </div>
    </section>

    <!-- ================= EVOLUTION ================= -->
    <section id="evolution" class="view">
      <h2>Évolution des admissions</h2>
      <div class="chart-controls">
        <div class="btn-group">
          <button data-year="2023" class="active">2023</button>
          <button data-year="2024">2024</button>
        </div>

        <!-- <div class="btn-group">
          <button data-metric="can" class="active">Candidatures</button>
          <button data-metric="acc">Admis</button>
        </div> -->
      </div>
      <div id="chart-evolution" style="width:100%; height:350px;"></div>
      <p id="chart-evolution-label" class="chart-evolution-label"></p>

    </section>
    <!-- ================= SIMILAIRES ================= -->

    <section id="similaires-container">
      <h2>Masters similaires</h2>
      <ul id="similaires"></ul>
    </section>

  </main>


  <!-- OUTILS DE DEBUG (invisibles ) -->
  <div class="debug-tools" style="display:flex; gap:8px; margin:8px 0;">
    <input id="inpId" placeholder="formation_id (ex: ABC123)" hidden />
    <button id="btnLoad" hidden>Charger (comparatif)</button>
  </div>



</body>

</html>
