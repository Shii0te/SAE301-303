<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <title>Recherche de Masters – MASTER+</title>
  <link rel="stylesheet" href="/styles/main.css" />
</head>

<body>

  <!-- ===== CONTENU PRINCIPAL ===== -->
  <main class="tools-container">
    <section class="tools-intro">
      <h2 class="tools-title">Rechercher un Master</h2>
      <p class="tools-description">
        Tape quelques mots clés (ex : <strong>informatique paris</strong>) et choisis l’année.
        Clique ensuite sur un résultat pour consulter sa fiche complète.
      </p>

      <!-- BARRE DE RECHERCHE -->
      <div class="tools-search-bar">
        <input id="q" placeholder="Rechercher une formation…" />
        <select id="annee">
          <option value="2024">2024</option>
          <option value="2023">2023</option>
        </select>
        <button id="btnSearch">Rechercher</button>
      </div>


      <!-- STATUS -->
      <div id="status" class="tools-status"></div>

    </section>

    <!-- RÉSULTATS -->
    <div id="results" class="tools-results"></div>

  </main>


  <!-- ===== JAVASCRIPT ===== -->
  <script type="module">
    async function search(q, annee) {
      const res = await fetch(`/api/search?annee=${encodeURIComponent(annee)}&q=${encodeURIComponent(q)}`);
      if (!res.ok) throw new Error("Recherche impossible");
      return res.json();
    }

    function setStatus(msg, type = "info") {
      const s = document.querySelector("#status");
      s.textContent = msg;
      s.dataset.type = type;
    }

    function renderResults(arr, limit = 200) {
      const box = document.querySelector("#results");
      if (!arr.length) {
        box.innerHTML = `<p class="no-result">Aucun résultat pour cette recherche.</p>`;
        return;
      }

      const shown = arr.slice(0, limit);

      box.innerHTML = shown.map(r => `
                <div class="result-card">
                    <strong>${r.mention}</strong>
                    <small>${r.etab}</small>
                    <div class="card-buttons">
                        <a href="/?id=${encodeURIComponent(r.id)}">
                            <button>Voir la fiche</button>
                        </a>
                        <button class="copy" data-id="${r.id}">Copier l’ID</button>
                    </div>
                </div>
            `).join("");

      box.querySelectorAll(".copy").forEach(btn => {
        btn.addEventListener("click", async () => {
          await navigator.clipboard.writeText(btn.dataset.id);
          setStatus("ID copié ✔️");
        });
      });
    }

    // Événement du bouton
    document.querySelector("#btnSearch").addEventListener("click", async () => {
      const q = document.querySelector("#q").value.trim();
      const annee = document.querySelector("#annee").value;
      setStatus("Recherche…");
      const arr = await search(q, annee);
      setStatus(`${arr.length} résultat(s) trouvé(s).`);
      renderResults(arr, 200);
    });

    // Chargement initial
    window.addEventListener("DOMContentLoaded", async () => {
      const annee = document.querySelector("#annee").value;
      setStatus("Chargement des formations…");
      const arr = await search("", annee);
      setStatus(`${arr.length} formations listées (200 affichées).`);
      renderResults(arr, 200);
    });
  </script>

</body>

</html>
