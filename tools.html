<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <title>Recherche de Masters – MASTER+</title>
  <link rel="stylesheet" href="/styles/main.css" />
</head>

<body>
  <header>
    <nav>
      <a href="/"><img src="./images/logo-alt.png" alt="logo master plus" width="150" /></a>
      <ul>
        <li>
          <a href="/">Accueil</a>
        </li>
        <li>
          <a id="active-page" href="/tools">Master</a>
        </li>
      </ul>
    </nav>
  </header>
  <!-- ===== CONTENU PRINCIPAL ===== -->
  <main class="tools-container">
    <section class="tools-intro">

      <h1 class="tools-title">Rechercher un Master</h1>
      <p class="tools-description">
        Tape quelques mots clés (ex : <strong>informatique paris</strong>) et choisis l’année.
        Clique ensuite sur un résultat pour consulter sa fiche complète.
      </p>

      <div class="tools-search-wrapper">

        <!-- Barre blanche arrondie -->
        <div class="tools-search-bar">
          <img src="./images/loupe.png" width="22" class="search-icon">
          <input id="q" placeholder="Rechercher un master…" />
        </div>

        <!-- Ligne de filtres en dessous (comme la maquette) -->
        <div class="tools-filters">
          <!-- Select année = vrai filtre, utilisé par le JS -->
          <select id="annee" class="filter-chip filter-select">
            <option value="2024">Année 2024</option>
            <option value="2023">Année 2023</option>
          </select>

          <!-- Filtres visuels (facultatifs, décoratifs) -->
          <button type="button" class="filter-chip">Filtre X</button>
          <button type="button" class="filter-chip">Filtre X</button>
          <button type="button" class="filter-chip">Filtre X</button>
          <button type="button" class="filter-chip">Filtre X</button>
        </div>

        <!-- Bouton principal -->
        <button id="btnSearch" class="tools-search-btn">Rechercher</button>

      </div>

    </section>


    <!-- STATUS -->
    <div id="status" class="tools-status"></div>
    <!-- RÉSULTATS -->
    <ul id="results" class="tools-results"></ul>

  </main>


  <!-- ===== JAVASCRIPT ===== -->
  <script type="module">
    async function search(q, annee) {
      const url = `/api/search?q=${encodeURIComponent(q)}&annee=${encodeURIComponent(annee)}`;
      const res = await fetch(url);

      if (!res.ok) throw new Error("Recherche impossible");
      return res.json();
    }


    function setStatus(msg, type = "info") {
      const s = document.querySelector("#status");
      s.textContent = msg;
      s.dataset.type = type;
    }

    function renderResults(arr, limit = 200) {
      const box = document.querySelector("#results");
      if (!arr.length) {
        box.innerHTML = `<p class="no-result">Aucun résultat pour cette recherche.</p>`;
        return;
      }

      const shown = arr.slice(0, limit);

      box.innerHTML = shown.map(r => `
                <li class="result-card">
                    <div class="card-header">
                      <img src="https://monmaster.gouv.fr/api/logo/${r.uai}" class="logo-result" />
                    </div>
                    <strong>${r.mention}</strong>
                    <small>${r.etab}</small>
                    <a class="card-button" href="/master?id=${encodeURIComponent(r.id)}">
                      <button>Voir la fiche</button>
                    </a>
                </li>
            `).join("");

      box.querySelectorAll(".copy").forEach(btn => {
        btn.addEventListener("click", async () => {
          await navigator.clipboard.writeText(btn.dataset.id);
          setStatus("ID copié ✔️");
        });
      });
    }

    // Événement du bouton
    document.querySelector("#btnSearch").addEventListener("click", async () => {
      const q = document.querySelector("#q").value.trim();
      const annee = document.querySelector("#annee").value;
      setStatus("Recherche…");
      const arr = await search(q, annee);
      setStatus(`${arr.length} résultat(s) trouvé(s).`);
      renderResults(arr, 200);
    });

    // Chargement initial
    window.addEventListener("DOMContentLoaded", async () => {
      const annee = document.querySelector("#annee").value;
      setStatus("Chargement des formations…");
      const arr = await search("", annee);
      setStatus(`${arr.length} formations listées (200 affichées).`);
      renderResults(arr, 200);
    });
  </script>

</body>

</html>
