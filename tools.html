<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <title>Outils MonMaster</title>
    <link rel="stylesheet" href="/styles/main.css" />
</head>

<body>
    <main style="max-width:960px;margin:24px auto;">
        <h1>Outils • Recherche d’identifiants</h1>

        <div style="display:flex;gap:8px;align-items:center;margin:12px 0">
            <input id="q" placeholder="ex: informatique paris cité" style="flex:1" />
            <select id="annee">
                <option value="2024">2024</option>
                <option value="2023">2023</option>
            </select>
            <button id="btnSearch">Rechercher</button>
        </div>

        <div id="status"></div>
        <div id="results" style="margin-top:12px"></div>
    </main>

    <script type="module">
        async function search(q, annee) {
            const res = await fetch(`/api/search?annee=${encodeURIComponent(annee)}&q=${encodeURIComponent(q)}`);
            if (!res.ok) throw new Error("Recherche impossible");
            return res.json();
        }
        function setStatus(msg, type = "info") { const s = document.querySelector("#status"); s.textContent = msg; s.dataset.type = type; }

        document.querySelector("#btnSearch").addEventListener("click", async () => {
            const q = (document.querySelector("#q").value || "").trim();
            const annee = document.querySelector("#annee").value;
            if (!q) return setStatus("Tape un mot-clé (mention ou établissement).", "error");
            setStatus("Recherche…", "loading");
            try {
                const arr = await search(q, annee);
                setStatus(`${arr.length} résultat(s).`);
                const box = document.querySelector("#results");
                box.innerHTML = arr.map(r => `
          <div style="border:1px solid #eee;border-radius:10px;padding:10px;margin-bottom:8px">
            <div><strong>${r.mention}</strong></div>
            <div style="color:#666">${r.etab}</div>
            <div style="font-size:12px;margin:4px 0">ID: <code>${r.id}</code></div>
            <div style="display:flex;gap:8px;margin-top:6px">
                <a href="/?id=${encodeURIComponent(r.id)}" style="text-decoration:none">
                <button>Ouvrir dans le viewer</button>
              </a>
              <button data-id="${r.id}" class="copy">Copier l’ID</button>
            </div>
          </div>
        `).join("");

                // copy buttons
                box.querySelectorAll(".copy").forEach(btn => {
                    btn.addEventListener("click", async () => {
                        await navigator.clipboard.writeText(btn.dataset.id);
                        setStatus("ID copié dans le presse-papiers ✔️");
                    });
                });
            } catch (e) {
                setStatus(`Erreur: ${e.message}`, "error");
            }
        });
    </script>
</body>

</html>
