<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <title>MASTER+ - Page de recherche de Masters </title>
  <link rel="stylesheet" href="/styles/main.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- =========================================================================
       HEADER
  ========================================================================= -->
  <header>
    <nav>
      <a href="/">
        <img src="./images/logo-alt.png" alt="logo master plus" width="150" />
      </a>
      <ul>
        <li><a href="/">Accueil</a></li>
        <li><a id="active-page" href="/tools">Masters</a></li>
      </ul>
    </nav>
  </header>

  <!-- =========================================================================
       CONTENU PRINCIPAL
  ========================================================================= -->
  <main class="tools-container">

    <section class="tools-intro">
      <h1 class="tools-title">Rechercher un Master</h1>
      <p class="tools-description">
        Tape quelques mots-clés (ex : <strong>informatique paris</strong>)
        et clique sur un résultat pour consulter la fiche détaillée.
      </p>

      <div class="tools-search-wrapper">

        <!-- Barre de recherche -->
        <div class="tools-search-bar">
          <img src="./images/loupe.png" width="22" class="search-icon" alt="" />
          <input id="q" type="search" placeholder="Rechercher un master…" autocomplete="off" />
        </div>

        <!-- Filtres visuels (optionnels / décoratifs) -->
        <div class="tools-filters">
          <button type="button" class="filter-chip">Filtre X</button>
          <button type="button" class="filter-chip">Filtre X</button>
          <button type="button" class="filter-chip">Filtre X</button>
          <button type="button" class="filter-chip">Filtre X</button>
        </div>

        <!-- Bouton principal -->
        <button id="btnSearch" class="tools-search-btn active">Rechercher</button>
      </div>
    </section>
    <section class="resultats">
      <!-- STATUS -->
      <p id="status" class="status"></p>

      <!-- RÉSULTATS -->
      <ul id="results"></ul>
    </section>
  </main>

  <!-- =========================================================================
       JAVASCRIPT
  ========================================================================= -->
  <script type="module">
    window.addEventListener("load", handleSearch);

    const input = document.querySelector("#q");
    const btn = document.querySelector("#btnSearch");
    const resultsBox = document.querySelector("#results");

    async function search(q) {
      const url = `/api/search?q=${encodeURIComponent(q)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("Recherche impossible");
      return res.json();
    }

    function setStatus(msg = "", type = "info") {
      const s = document.querySelector("#status");
      s.textContent = msg;
      s.dataset.type = type;
    }

    function renderResults(list, limit = 200) {
      if (!list.length) {
        resultsBox.innerHTML =
          `<p class="no-result">Aucun résultat pour cette recherche.</p>`;
        return;
      }

      resultsBox.innerHTML = list.slice(0, limit).map(r => `
        <li class="result-card">
          <div class="card-header">
            <img
              src="https://monmaster.gouv.fr/api/logo/${r.uai}"
              alt=""
              class="logo-result"
            />
          </div>
          <strong>${r.mention}</strong>
          <small>${r.etab}</small>
          <a class="card-button" href="/master?id=${encodeURIComponent(r.id)}">
            <button>Voir la fiche</button>
          </a>
        </li>
      `).join("");
    }

    async function handleSearch() {
      const q = input.value.trim();

      setStatus("Recherche en cours…", "loading");

      try {
        const data = await search(q);
        setStatus(`${data.length} résultat(s).`, "success");
        renderResults(data);
      } catch (err) {
        console.error(err);
        setStatus("Erreur lors de la recherche.", "error");
      }
    }

    btn.addEventListener("click", handleSearch);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") handleSearch();
    });
  </script>

</body>

</html>
